<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UID | Pass | Cookies  BY SAMRATVAU Formatter</title>
  <style>
    :root { color-scheme: dark; --bg: #101827; --panel: #172235; --line: #2b3b55; --text: #e8eef7; --muted: #9aabc3; --accent: #59d6a4; --danger: #ff8c8c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 85% 0, #24445a 0, transparent 34%), var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 56px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 40px); letter-spacing: .2px; }
    h1 span { color: var(--accent); }
    .sub, .note { color: var(--muted); }
    .note { border-left: 3px solid var(--accent); padding: 9px 12px; margin: 18px 0 24px; background: #132435; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 18px; }
    .panel { background: rgba(23, 34, 53, .92); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: 0 14px 35px #08101d66; }
    label { display: block; color: var(--muted); font-size: 13px; margin: 0 0 7px; }
    textarea, input, select { width: 100%; color: var(--text); background: #0f1928; border: 1px solid var(--line); border-radius: 6px; padding: 10px 11px; font: inherit; outline: none; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #59d6a433; }
    #source { min-height: 280px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
    #output { min-height: 280px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; color: #07151a; background: var(--accent); font-weight: 700; cursor: pointer; }
    button.secondary { color: var(--text); background: #263650; }
    button:hover { filter: brightness(1.1); }
    .stats { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 13px; color: var(--muted); font-size: 13px; }
    .check input { width: auto; accent-color: var(--accent); }
    .help { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .error { color: var(--danger); min-height: 21px; margin-top: 8px; font-size: 13px; }
    @media (max-width: 760px) { main { width: min(100% - 20px, 620px); padding-top: 25px; } .layout { grid-template-columns: 1fr; } .controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>UID <span>|</span> Pass <span>|</span> Cookies</h1>
      <div class="sub">Excel sheet থেকে data clean করে TXT format-এ নিন</div>
    </header>
    <div class="note">জীবন দিয়ে দিতাম একবার বলতে আমার তোমাকে লাগবে..!</div>

    <section class="layout">
      <div class="panel">
        <label for="source">Excel থেকে paste করুন (প্রতি row-তে column আলাদা করতে Tab)</label>
        <textarea id="source" spellcheck="false" placeholder="uid&#9;password&#9;cookies
shakib@21&#9;secret&#9;datr=...; sb=..."></textarea>
        <div class="controls">
          <div><label for="uidCol">UID column</label><select id="uidCol"></select></div>
          <div><label for="passCol">Pass column</label><select id="passCol"></select></div>
          <div><label for="cookieCol">Cookies column</label><select id="cookieCol"></select></div>
        </div>
        <label class="check"><input id="header" type="checkbox"> প্রথম row header, তাই বাদ দিন</label>
        <label class="check"><input id="cookieUid" type="checkbox" checked> Cookie-এর c_user থেকে UID নিন</label>
        <label class="check"><input id="dedupe" type="checkbox" checked> একই output row duplicate হলে বাদ দিন</label>
        <div class="actions">
          <button id="format">Format output</button>
          <button id="clear" class="secondary">Clear</button>
        </div>
        <div id="error" class="error"></div>
        <div id="stats" class="stats">এখনও কোনো data দেওয়া হয়নি</div>
        <div class="help">যদি আপনার sheet-এ password column না থাকে, Pass column-এ “খালি” নির্বাচন করুন।</div>
      </div>
      <div class="panel">
        <label for="output">Output: uid|pass|cookies</label>
        <textarea id="output" readonly spellcheck="false" placeholder="shakib@21|secret|datr=...; sb=..."></textarea>
        <div class="actions">
          <button id="download">Download .txt</button>
          <button id="copy" class="secondary">Copy output</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const source = document.querySelector('#source');
    const output = document.querySelector('#output');
    const uidCol = document.querySelector('#uidCol');
    const passCol = document.querySelector('#passCol');
    const cookieCol = document.querySelector('#cookieCol');
    const error = document.querySelector('#error');
    const stats = document.querySelector('#stats');

    function rows() {
      return source.value.split(/\r?\n/).filter(line => line.trim()).map(line => line.split('\t'));
    }

    function option(select, value, text) {
      const item = document.createElement('option');
      item.value = value;
      item.textContent = text;
      select.append(item);
    }

    function updateColumns() {
      const count = Math.max(3, ...rows().map(row => row.length), 0);
      const selects = [uidCol, passCol, cookieCol];
      const old = selects.map(select => select.value);
      selects.forEach(select => {
        select.replaceChildren();
        option(select, '-1', 'খালি');
        for (let index = 0; index < count; index++) option(select, String(index), `Column ${index + 1}`);
      });
      uidCol.value = old[0] && Number(old[0]) < count ? old[0] : '0';
      passCol.value = old[1] && Number(old[1]) < count ? old[1] : '1';
      cookieCol.value = old[2] && Number(old[2]) < count ? old[2] : '2';
    }

    function extractCookieUid(cookie) {
      const match = cookie.match(/(?:^|;\s*)c_user=([^;]*)/i);
      if (!match) return '';
      try { return decodeURIComponent(match[1]); } catch { return match[1]; }
    }

    function formatOutput() {
      error.textContent = '';
      const inputRows = rows();
      if (!inputRows.length) { output.value = ''; stats.textContent = 'কোনো data পাওয়া যায়নি'; return; }
      const start = document.querySelector('#header').checked ? 1 : 0;
      const seen = new Set();
      const result = [];
      for (const row of inputRows.slice(start)) {
        const value = index => index === '-1' ? '' : (row[Number(index)] || '').trim();
        const cookie = value(cookieCol.value);
        const uid = document.querySelector('#cookieUid').checked ? extractCookieUid(cookie) || value(uidCol.value) : value(uidCol.value);
        const line = [uid, value(passCol.value), cookie].join('|');
        if (!line.replaceAll('|', '').trim()) continue;
        if (document.querySelector('#dedupe').checked && seen.has(line)) continue;
        seen.add(line);
        result.push(line);
      }
      output.value = result.join('\n');
      stats.textContent = `${result.length} row formatted${inputRows.length - start - result.length > 0 ? `, ${inputRows.length - start - result.length} skipped` : ''}`;
    }

    source.addEventListener('input', updateColumns);
    document.querySelector('#format').addEventListener('click', formatOutput);
    document.querySelector('#clear').addEventListener('click', () => { source.value = ''; output.value = ''; updateColumns(); stats.textContent = 'এখনও কোনো data দেওয়া হয়নি'; error.textContent = ''; });
    document.querySelector('#download').addEventListener('click', () => {
      if (!output.value) { error.textContent = 'আগে Format output চাপুন।'; return; }
      const blob = new Blob([output.value + '\n'], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = 'uid-pass-cookies.txt'; link.click();
      URL.revokeObjectURL(link.href);
    });
    document.querySelector('#copy').addEventListener('click', async () => {
      if (!output.value) { error.textContent = 'আগে Format output চাপুন।'; return; }
      await navigator.clipboard.writeText(output.value);
      stats.textContent = 'Output clipboard-এ copy হয়েছে';
    });
    updateColumns();
  </script>
</body>
</html>
